name: Hidden Narrative Chain PR Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-apk/**'
      - '.github/workflows/test-hidden-narrative-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript choice UI
        run: node --test android-apk/app/src/test/js/*.test.cjs
      - name: Run Android unit tests and assemble debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload testable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hidden-narrative-chain-debug
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
