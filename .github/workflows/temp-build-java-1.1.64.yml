name: TEMP Build Java 1.1.64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-build-java-1.1.64.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_4 }}
      HAIKU_API_KEY: ${{ secrets.HAIKU_API_KEY }}
      HAIKU_API: ${{ secrets.HAIKU_API }}
      HAIKU_MODEL: ${{ secrets.HAIKU_MODEL }}
      HAIKU_BASE_URL: ${{ secrets.HAIKU_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 361e4d114ebc191d50121ebab5287eadd7e8468c

      - name: Verify Java-only source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find android-apk -type f \( -name '*.kt' -o -name '*.kts' \) -print -quit)"
          ! grep -R "org.jetbrains.kotlin" -n android-apk/build.gradle android-apk/app/build.gradle
          ! grep -R "kotlinOptions" -n android-apk/build.gradle android-apk/app/build.gradle
          grep -Fq "versionCode 66" android-apk/app/build.gradle
          grep -Fq "versionName '1.1.64'" android-apk/app/build.gradle

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.64.apk
          test -s Backroom-1.1.64.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose Backroom-1.1.64.apk
          BADGING=$("$BUILD_TOOLS/aapt" dump badging Backroom-1.1.64.apk)
          grep -q "package: name='com.rabpit.backroom' versionCode='66' versionName='1.1.64'" <<<"$BADGING"
          unzip -l Backroom-1.1.64.apk | grep -q 'assets/index.html'

      - name: Replace v1.1.64 release with Java build
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'v1.1.64';
            const target = '361e4d114ebc191d50121ebab5287eadd7e8468c';

            try {
              const old = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: old.data.id });
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            try {
              await github.rest.git.deleteRef({ owner, repo, ref: 'tags/' + tag });
            } catch (e) {
              if (e.status !== 404 && e.status !== 422) throw e;
            }

            const notes = fs.readFileSync('android-apk/RELEASE_NOTES_1.1.64.txt', 'utf8');
            const created = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: target,
              name: 'Backroom 1.1.64 Debug',
              body: notes,
              draft: false,
              prerelease: false
            });

            const apk = fs.readFileSync('Backroom-1.1.64.apk');
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: created.data.id,
              name: 'Backroom-1.1.64.apk',
              data: apk,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': apk.length
              }
            });

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.64-java-debug
          path: Backroom-1.1.64.apk
          retention-days: 1
