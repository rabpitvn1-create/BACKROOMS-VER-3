name: TEMP Clear two old Actions runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-clear-two-runs.yml'

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const run_id of [36704142756, 36702709806]) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
