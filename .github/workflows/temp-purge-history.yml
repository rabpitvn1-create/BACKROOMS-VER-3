# Temporary, one-shot maintenance workflow. Remove this file once its run completes.
name: TEMP Purge Failed Queued Cancelled Runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-purge-history.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: temporary-history-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Version currently queued before this maintenance commit.
      RELEASE_SHA: f7bc2896a4275e826cc6476a8dea216ea5651818
    steps:
      - name: Remove all historical failed, cancelled and queued runs
        shell: bash
        run: |
          set -euo pipefail

          # Take a complete snapshot before any deletion, so pagination does not
          # shift under us. Never delete successful or in-progress runs.
          records=$(gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(
              (.conclusion == "failure" or .conclusion == "cancelled" or
               .conclusion == "timed_out" or .conclusion == "action_required" or
               .conclusion == "startup_failure" or .conclusion == "stale") or
              (.status == "queued" or .status == "pending" or
               .status == "waiting" or .status == "requested")
              ) | .id')
          mapfile -t ids < <(printf '%s\n' "$records" | sed '/^$/d')
          echo "Historical runs selected for cleanup: ${#ids[@]}"

          deleted=0
          skipped=0
          failed=0
          restart_release=0
          for id in "${ids[@]}"; do
            # Exclude this maintenance run and always re-check current status
            # to avoid racing a queued run that has started executing.
            if [[ "$id" == "$GITHUB_RUN_ID" ]]; then
              ((skipped+=1))
              continue
            fi
            current=$(gh api "repos/$GH_REPO/actions/runs/$id" \
              --jq '[.status, (.conclusion // "none"), .head_sha, .name] | @tsv') || {
              echo "::warning::Could not fetch run $id, skipping"
              ((skipped+=1))
              continue
            }
            IFS=$'\t' read -r status conclusion sha name <<<"$current"
            if [[ "$status" == "in_progress" ]]; then
              echo "Preserve now-running $id ($name)"
              ((skipped+=1))
              continue
            fi

            if [[ "$status" == "queued" || "$status" == "pending" ||
                  "$status" == "waiting" || "$status" == "requested" ]]; then
              echo "Cancelling queued run $id ($name)"
              if ! gh api -X POST "repos/$GH_REPO/actions/runs/$id/cancel" >/dev/null 2>&1; then
                gh api -X POST "repos/$GH_REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1 || true
              fi
              # Deletion is permitted only after the run actually stops.
              for attempt in {1..18}; do
                status=$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.status' 2>/dev/null) || break
                [[ "$status" == "completed" ]] && break
                sleep 3
              done
              if [[ "$status" != "completed" ]]; then
                echo "::warning::Queued run $id could not be stopped, preserving it"
                ((failed+=1))
                continue
              fi
              # A cancelled pending v1.1.69 build must be relaunched once
              # the old queue has been purged, so the release is not lost.
              if [[ "$name" == "Build Backroom APK" && "$sha" == "$RELEASE_SHA" ]]; then
                restart_release=1
              fi
            elif [[ "$status" == "completed" ]]; then
              case "$conclusion" in
                failure|cancelled|timed_out|action_required|startup_failure|stale) ;;
                *)
                  echo "Preserve $id: conclusion changed to $conclusion"
                  ((skipped+=1))
                  continue
                  ;;
              esac
            else
              echo "Preserve $id: unknown state $status"
              ((skipped+=1))
              continue
            fi

            if gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" >/dev/null; then
              echo "Deleted run $id"
              ((deleted+=1))
            else
              echo "::warning::Could not delete run $id"
              ((failed+=1))
            fi
            # Avoid sending a burst of destructive API requests.
            sleep 1
          done

          if [[ "$restart_release" -eq 1 ]]; then
            echo "Re-dispatching v1.1.69 release that was pending before cleanup"
            gh workflow run build-backroom-apk.yml --ref main
          fi

          {
            echo "### Temporary Actions run-history purge"
            echo "- Selected from all pages: ${#ids[@]}"
            echo "- Deleted: $deleted"
            echo "- Preserved/skipped: $skipped"
            echo "- Failed deletions: $failed"
            echo "- Re-dispatched pending v1.1.69 release: $restart_release"
            echo "- Completed successful and running workflows were not targeted."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "RESULT: selected=${#ids[@]} deleted=$deleted skipped=$skipped failed=$failed release_restarted=$restart_release"

          if [[ "$failed" -gt 0 ]]; then
            echo "::error::Some runs could not be deleted; inspect this run summary"
            exit 1
          fi
