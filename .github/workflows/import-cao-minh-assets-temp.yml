name: Import Cao Minh Assets Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-cao-minh-assets-temp.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact Cao Minh assets from V2
        shell: bash
        run: |
          set -euo pipefail
          V2_SHA=816fb62c7c4f58358fb99af4a535827c67725cff
          BASE="https://raw.githubusercontent.com/rabpitvn1-create/BACKROOMsV2/$V2_SHA/android-apk/app/src/main/assets"
          mkdir -p android-apk/app/src/main/assets/avatars
          curl -fsSL "$BASE/avatars/cao_minh_avatar.jpg" -o android-apk/app/src/main/assets/avatars/cao_minh_avatar.jpg
          curl -fsSL "$BASE/cao_minh_entity_overlay.png" -o android-apk/app/src/main/assets/cao_minh_entity_overlay.png
          curl -fsSL "$BASE/cao_minh_snapshot_overlay.png" -o android-apk/app/src/main/assets/cao_minh_snapshot_overlay.png
          echo 'bddf46b160f690dcfe300d7ac603a2663ceb47fe2042424d8fe571b064f9fb67  android-apk/app/src/main/assets/avatars/cao_minh_avatar.jpg' | sha256sum -c -
          echo '980aaaf8a8575d41ab66b95d8ab24ca7052b66677a1a15e0eb6433c8b716eb47  android-apk/app/src/main/assets/cao_minh_entity_overlay.png' | sha256sum -c -
          echo 'e02f27c3125c3c4c3c3eb4b4314c93bab89d0ac18c92f8038ee2533d616bbd6e  android-apk/app/src/main/assets/cao_minh_snapshot_overlay.png' | sha256sum -c -
      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-apk/app/src/main/assets/avatars/cao_minh_avatar.jpg \
                  android-apk/app/src/main/assets/cao_minh_entity_overlay.png \
                  android-apk/app/src/main/assets/cao_minh_snapshot_overlay.png
          git diff --cached --quiet && exit 0
          git commit -m 'Import Cao Minh avatar and overlays from V2'
          git pull --rebase origin main
          git push origin HEAD:main
