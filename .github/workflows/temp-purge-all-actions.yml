name: TEMP Purge All Actions History

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-purge-all-actions.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: temp-purge-all-actions-history
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete every other Actions run
        shell: bash
        run: |
          set -euo pipefail

          purge_pass() {
            local pass="$1"
            mapfile -t ids < <(
              gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100"                 --jq '.workflow_runs[].id'
            )

            echo "Pass $pass: found ${#ids[@]} run records"
            local deleted=0
            local skipped=0

            for id in "${ids[@]}"; do
              [[ -z "$id" ]] && continue
              if [[ "$id" == "$GITHUB_RUN_ID" ]]; then
                ((skipped+=1))
                continue
              fi

              if ! meta=$(gh api "repos/$GH_REPO/actions/runs/$id"                 --jq '[.status, (.conclusion // "none"), .name] | @tsv' 2>/dev/null); then
                continue
              fi
              IFS=$'\t' read -r status conclusion name <<<"$meta"

              if [[ "$status" != "completed" ]]; then
                echo "Stopping run $id ($name), status=$status"
                gh api -X POST "repos/$GH_REPO/actions/runs/$id/cancel" >/dev/null 2>&1 ||                   gh api -X POST "repos/$GH_REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1 || true

                for attempt in {1..30}; do
                  status=$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.status' 2>/dev/null || echo gone)
                  [[ "$status" == "completed" || "$status" == "gone" ]] && break
                  sleep 2
                done
              fi

              if gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" >/dev/null 2>&1; then
                echo "Deleted run $id ($name)"
                ((deleted+=1))
              else
                echo "::warning::Could not delete run $id ($name)"
              fi
              sleep 0.2
            done

            echo "Pass $pass complete: deleted=$deleted skipped_current=$skipped"
          }

          purge_pass 1
          sleep 3
          purge_pass 2

      - name: Delete this cleanup run record
        shell: bash
        continue-on-error: true
        run: |
          # Best effort: GitHub may reject deletion of the currently executing run.
          gh api -X DELETE "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
