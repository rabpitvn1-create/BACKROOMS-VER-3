name: Cleanup failed and queued runs (temporary)

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-failed-runs-temp.yml]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel queued runs and delete failed runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate -X GET \
            "repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=100" \
            --jq '.workflow_runs[].id' > "$RUNNER_TEMP/queued-runs.txt"
          queued=0
          while IFS= read -r run_id; do
            if ! gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
              test "$status" = completed
            fi
            for attempt in {1..24}; do
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
              test "$status" = completed && break
              sleep 5
            done
            test "$status" = completed
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" >/dev/null
            queued=$((queued + 1))
          done < "$RUNNER_TEMP/queued-runs.txt"
          gh api --paginate -X GET \
            "repos/$GITHUB_REPOSITORY/actions/runs?status=failure&per_page=100" \
            --jq '.workflow_runs[].id' > "$RUNNER_TEMP/failed-runs.txt"
          deleted=0
          while IFS= read -r run_id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" >/dev/null
            deleted=$((deleted + 1))
          done < "$RUNNER_TEMP/failed-runs.txt"
          echo "Deleted $queued queued and $deleted failed workflow runs."
