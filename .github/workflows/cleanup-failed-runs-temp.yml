name: Cleanup failed runs (temporary)

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-failed-runs-temp.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete failed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate -X GET \
            "repos/$GITHUB_REPOSITORY/actions/runs?status=failure&per_page=100" \
            --jq '.workflow_runs[].id' > "$RUNNER_TEMP/failed-runs.txt"
          deleted=0
          while IFS= read -r run_id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" >/dev/null
            deleted=$((deleted + 1))
          done < "$RUNNER_TEMP/failed-runs.txt"
          echo "Deleted $deleted failed workflow runs."
