name: Import BACKROOMsV2 v1.1.64 baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-v1164.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace target tree with BACKROOMsV2 v1.1.64
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch v1.1.64 https://github.com/rabpitvn1-create/BACKROOMsV2.git "$tmp/source"
          rsync -a --delete --exclude='.git/' "$tmp/source/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import BACKROOMsV2 v1.1.64 baseline"
          git push origin HEAD:main
