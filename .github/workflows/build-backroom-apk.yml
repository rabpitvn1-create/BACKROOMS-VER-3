name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-backroom-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_4 }}
      HAIKU_API_KEY: ${{ secrets.HAIKU_API_KEY }}
      HAIKU_MODEL: ${{ secrets.HAIKU_MODEL }}
      HAIKU_BASE_URL: ${{ secrets.HAIKU_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version and provider baseline
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 67' android-apk/app/build.gradle
          grep -Fq "versionName '1.1.65'" android-apk/app/build.gradle
          test -s android-apk/RELEASE_NOTES_1.1.65.txt
          test ! -e android-apk/patch-luna-text.py
          test ! -e android-apk/patch-luna-model-failover-final.py
          test ! -e android-apk/patch-provider-deadline-final.py
          ! grep -q 'LUNA_' android-apk/app/build.gradle

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 HAIKU_API_KEY HAIKU_MODEL HAIKU_BASE_URL; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.65.apk

      - name: Verify packaged APK
        run: |
          set -euo pipefail
          test -s Backroom-1.1.65.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.65.apk
          BADGING=$("$BUILD_TOOLS/aapt" dump badging Backroom-1.1.65.apk)
          grep -q "package: name='com.rabpit.backroom' versionCode='67' versionName='1.1.65'" <<<"$BADGING"
          grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'" <<<"$BADGING"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.65.apk
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/index.html'
          INDEX_HTML=$(unzip -p Backroom-1.1.65.apk assets/index.html)
          grep -Fq 'player:{name:"Cao Minh"' <<<"$INDEX_HTML"
          ! grep -Fq 'MAIN_BACKROOMS' <<<"$INDEX_HTML"
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/snapshot-ui.js'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/gm-choice-ui.js'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/party-ui.js'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/chest_overlay.png'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/dice/die-1.svg'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/dice/die-6.svg'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/entity/hound.webp'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/entity/slenderman.webp'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/entity/diep_minh.webp'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.65-debug-apk
          path: Backroom-1.1.65.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.65
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.65'
          TITLE='Backroom 1.1.65 Debug'
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.65.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.65.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.65.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.1.65 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.65.apk' --output Backroom-1.1.65-verified.apk
          test -s Backroom-1.1.65-verified.apk
          cmp Backroom-1.1.65.apk Backroom-1.1.65-verified.apk
          sha256sum Backroom-1.1.65-verified.apk
